<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SYT - Sell Your Things">
  <defs>
    <linearGradient id="syt-fav-bg" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffa15c"/>
      <stop offset="55%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#cf3a08"/>
    </linearGradient>
    <linearGradient id="syt-fav-shine" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square stage -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#syt-fav-bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#syt-fav-shine)"/>

  <!-- Up-right exchange chevron (sell flow) -->
  <g stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85">
    <path d="M 39 18 L 47 13 L 47 21"/>
  </g>

  <!-- Bold S monogram -->
  <text x="32" y="48"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-weight="900" font-size="40" fill="#ffffff" text-anchor="middle"
        letter-spacing="-2">S</text>

  <!-- Down-left exchange chevron (buy flow) -->
  <g stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85">
    <path d="M 25 46 L 17 51 L 17 43"/>
  </g>
</svg>
