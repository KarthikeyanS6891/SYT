<svg width="156" height="44" viewBox="0 0 156 44" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SYT - Sell Your Things">
  <defs>
    <linearGradient id="syt-logo-bg" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffa15c"/>
      <stop offset="55%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#cf3a08"/>
    </linearGradient>
    <linearGradient id="syt-logo-shine" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Mark: 36x36 -->
  <g transform="translate(2,2)">
    <rect x="0" y="0" width="36" height="36" rx="9" fill="url(#syt-logo-bg)"/>
    <rect x="0" y="0" width="36" height="36" rx="9" fill="url(#syt-logo-shine)"/>

    <g stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85">
      <path d="M 22 10 L 27 7 L 27 12"/>
    </g>

    <text x="18" y="27"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-weight="900" font-size="23" fill="#ffffff" text-anchor="middle"
          letter-spacing="-1.2">S</text>

    <g stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85">
      <path d="M 14 26 L 9 29 L 9 24"/>
    </g>
  </g>

  <!-- Wordmark: S [arrow-Y] T -->
  <g transform="translate(46, 4)">
    <text x="0" y="25"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-weight="900" font-size="24" fill="#1f2937" letter-spacing="-1">S</text>

    <!-- Y as an upward chevron -->
    <g transform="translate(19, 4)"
       stroke="#ff6b35" stroke-width="3.4"
       stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 1 20 L 9 4 L 17 20"/>
      <path d="M 9 4 L 9 23"/>
    </g>

    <text x="44" y="25"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-weight="900" font-size="24" fill="#1f2937" letter-spacing="-1">T</text>
  </g>

  <!-- Tagline -->
  <text x="46" y="40"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="7" fill="#6b7280" letter-spacing="2.4">SELL YOUR THINGS</text>
</svg>
