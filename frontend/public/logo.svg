    <path d="M 29.8 13.9 C 28.3 12.1 24.9 11.5 22.6 12.5 C 20.2 13.6 19.6 16.4 21.6 18 C 22.7 18.9 24.4 19.3 25.9 19.8 C 27.4 20.3 29.1 21 29.5 22.9 C 30 25.1 28.2 27.2 25.6 27.6 C 23.1 27.9 20.6 27 19.5 25.3"
